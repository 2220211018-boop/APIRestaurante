# CI: compila, prueba y publica las imágenes Docker en GitHub Container Registry (GHCR).
# Criterio 1 de la rúbrica del Proyecto 04.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Pruebas automáticas de cada microservicio (en paralelo, una por servicio)
  pruebas:
    name: Pruebas · ${{ matrix.servicio }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio:
          - gateway
          - servicio_autenticacion
          - servicio_clientes_productos
          - servicio_pagos_domicilios
          - servicio_pedidos
          - servicio_inventario
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay pruebas para este servicio?
        id: hay
        run: |
          if ls ${{ matrix.servicio }}/tests/test_*.py >/dev/null 2>&1; then
            echo "si=true" >> "$GITHUB_OUTPUT"
          else
            echo "si=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.servicio }} todavía no tiene pruebas en tests/"
          fi

      - uses: actions/setup-python@v5
        if: steps.hay.outputs.si == 'true'
        with:
          python-version: "3.11" # la misma versión que usan los Dockerfile
          cache: pip
          cache-dependency-path: |
            ${{ matrix.servicio }}/requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        if: steps.hay.outputs.si == 'true'
        run: pip install -r ${{ matrix.servicio }}/requirements.txt -r requirements-dev.txt

      - name: Ejecutar pruebas
        if: steps.hay.outputs.si == 'true'
        run: python -m pytest ${{ matrix.servicio }}/tests -v --junitxml=resultados-${{ matrix.servicio }}.xml

      - name: Guardar resultados
        if: always() && steps.hay.outputs.si == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ matrix.servicio }}
          path: resultados-${{ matrix.servicio }}.xml

  # 2) Compilación del frontend (React + Vite)
  frontend:
    name: Compilar frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # 3) Validación de los manifiestos de Kubernetes
  manifiestos:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - run: python scripts/validar_k8s.py

  # 4) Construir y publicar las 6 imágenes en GHCR (solo al hacer push/merge en main)
  imagenes:
    name: Publicar imagen · ${{ matrix.nombre }}
    needs: [pruebas, frontend, manifiestos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: autenticacion, contexto: ./servicio_autenticacion, dockerfile: ./servicio_autenticacion/Dockerfile }
          - { nombre: clientes-productos, contexto: ., dockerfile: ./servicio_clientes_productos/Dockerfile }
          - { nombre: pagos-domicilios, contexto: ., dockerfile: ./servicio_pagos_domicilios/Dockerfile }
          - { nombre: pedidos, contexto: ., dockerfile: ./servicio_pedidos/Dockerfile }
          - { nombre: inventario, contexto: ., dockerfile: ./servicio_inventario/Dockerfile }
          - { nombre: gateway, contexto: ./gateway, dockerfile: ./gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/apirestaurante-${{ matrix.nombre }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.nombre }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nombre }}

      - name: Resumen
        run: echo "- \`${{ env.IMAGEN }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
