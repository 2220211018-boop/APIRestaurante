services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bd_restaurante
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_restaurante"]
      interval: 5s
      timeout: 5s
      retries: 10

  servicio_autenticacion:
    build:
      context: ./servicio_autenticacion
    environment:
      ADMIN_EMAIL: admin@restaurante.com
    ports:
      - "4004:8000"
    volumes:
      - ./private_key.pem:/app/private_key.pem:ro
      - ./public_key.pem:/app/public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy

  servicio_clientes_productos:
    build:
      context: .
      dockerfile: ./servicio_clientes_productos/Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - ./public_key.pem:/app/public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy

  servicio_pagos_domicilios:
    build:
      context: .
      dockerfile: ./servicio_pagos_domicilios/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - ./public_key.pem:/app/public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy

  servicio_pedidos:
    build:
      context: .
      dockerfile: ./servicio_pedidos/Dockerfile
    ports:
      - "8003:8000"
    environment:
      URL_PRODUCTOS: http://servicio_clientes_productos:8000
      URL_INVENTARIO: http://servicio_inventario:8000
    volumes:
      - ./public_key.pem:/app/public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      servicio_clientes_productos:
        condition: service_started
      servicio_inventario:
        condition: service_started

  servicio_inventario:
    build:
      context: .
      dockerfile: ./servicio_inventario/Dockerfile
    ports:
      - "8004:8000"
    environment:
      URL_PRODUCTOS: http://servicio_clientes_productos:8000
    volumes:
      - ./public_key.pem:/app/public_key.pem:ro
    depends_on:
      db:
        condition: service_healthy
      servicio_clientes_productos:
        condition: service_started

  gateway:
    build:
      context: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - servicio_autenticacion
      - servicio_clientes_productos
      - servicio_pagos_domicilios
      - servicio_pedidos
      - servicio_inventario

volumes:
  postgres_data:
